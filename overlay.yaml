# The nullable members of the merge-patch bodies. In a patch, an absent
# member leaves a value as it is and null clears it, so each of these is a
# Nullable, which can say absent, null and a value apart. Every other
# optional member is a pointer. Each is tagged omitzero, which leaves out
# an absent member, and not omitempty, which has no effect on a struct.
# scripts/generate.mjs refuses the document when a nullable patch member
# is missing from this list.
